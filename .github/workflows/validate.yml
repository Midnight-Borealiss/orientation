name: Validation des fiches

on:
  push:
    paths: ["data/filieres/**", "schema/**", "config/**", "scripts/**", "src/**", "web/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      # Le moteur se teste sur les fiches du dépôt : aucun PDF requis.
      - run: npm run test:moteur
      # L'écran de résultat : aucun score dans le DOM, aucun nom de filière dans le code,
      # dégradation quand la donnée manque. Le rendu est pur, il se teste sans navigateur.
      - run: npm run test:interface
      # Le contexte servi au navigateur doit rester en phase avec config/ et data/ : le
      # script refuse d'écrire s'il n'est plus servable, et `git diff` dit s'il a bougé.
      - run: npm run contexte:web
      - run: git diff --exit-code -- data/_contexte.json data/_fraicheur.json
      # Test de segmentation : la brochure Bachelor doit produire 26 fiches.
      # Ignoré si les catalogues PDF ne sont pas dans le dépôt.
      - run: npm run test:donnees
        if: hashFiles('data/brochures/*.pdf') != ''
      # Les seuils doivent rester conformes aux trois objectifs de la spec :
      # simuler.mjs sort en erreur sinon.
      - run: npm run simuler
      # La suite de tests ne doit RIEN écrire dans le dépôt. Ce contrôle réexécute les trois
      # suites et compare l'empreinte de chaque fichier : il attrape toute écriture en chemin
      # dur, y compris celles qu'aucun test ciblé ne vise. Il vient en dernier — il relance la
      # suite entière, et il n'a de sens qu'une fois les artefacts régénérés ci-dessus.
      # Sans les PDF, test-extract.mjs ne peut pas tourner et la mesure ne vaudrait rien.
      - run: npm run test:contamination
        if: hashFiles('data/brochures/*.pdf') != ''
